# reglages-amp.cfg - ECRIT PAR AMP a chaque demarrage, a partir de AMP_reglages.cfg.
# Ne le modifie pas a la main : change les reglages dans l'onglet Configuration
# d'AMP. Pour un reglage en plus, ecris-le dans perso.cfg.
# lancer-armagetron.py le relit, controle chaque valeur et ecrit
# config/settings_custom.cfg en Latin-1, l'encodage du jeu.
SERVER_NAME {{SERVER_NAME}}
TALK_TO_MASTER {{TALK_TO_MASTER}}
SERVER_OPTIONS {{SERVER_OPTIONS}}
URL {{URL}}
TITLE_OF_DAY {{TITLE_OF_DAY}}
MESSAGE_OF_DAY {{MESSAGE_OF_DAY}}
LANGUAGE_FIRST {{LANGUAGE_FIRST}}
LIMIT_ROUNDS {{LIMIT_ROUNDS}}
MIN_PLAYERS {{MIN_PLAYERS}}
TEAM_MAX_PLAYERS {{TEAM_MAX_PLAYERS}}
SPEED_FACTOR {{SPEED_FACTOR}}
SIZE_FACTOR {{SIZE_FACTOR}}
