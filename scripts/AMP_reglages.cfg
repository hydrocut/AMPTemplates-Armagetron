# reglages-amp.cfg - ECRIT PAR AMP a chaque demarrage, a partir de AMP_reglages.cfg.
# Ne le modifie pas a la main : change les reglages dans l'onglet Configuration
# d'AMP. Pour un reglage en plus, ecris-le dans perso.cfg.
# lancer-armagetron.py le relit, controle chaque valeur et ecrit
# config/settings_custom.cfg en Latin-1, l'encodage du jeu.
SERVER_NAME {{SERVER_NAME}}
TALK_TO_MASTER {{TALK_TO_MASTER}}
SERVER_OPTIONS {{SERVER_OPTIONS}}
URL {{URL}}
TITLE_OF_DAY {{TITLE_OF_DAY}}
MESSAGE_OF_DAY {{MESSAGE_OF_DAY}}
LANGUAGE_FIRST {{LANGUAGE_FIRST}}
LIMIT_ROUNDS {{LIMIT_ROUNDS}}
MIN_PLAYERS {{MIN_PLAYERS}}
TEAM_MAX_PLAYERS {{TEAM_MAX_PLAYERS}}
SPEED_FACTOR {{SPEED_FACTOR}}
SIZE_FACTOR {{SIZE_FACTOR}}
# Ajoutes le 11/10/2026 (cartes, modes, bots, votes). Une instance creee avant garde
# son ancien formulaire : AMP laisse alors ces lignes vides ou telles quelles, et le
# lanceur reprend le fonctionnement d'avant (voir NOUVELLES dans lancer-armagetron.py).
TK_MODE {{TK_MODE}}
TK_CARTES {{TK_CARTES}}
TK_ROTATION {{TK_ROTATION}}
TK_ROTATION_MANCHES {{TK_ROTATION_MANCHES}}
TK_BOTS {{TK_BOTS}}
TK_BOTS_PERMANENTS {{TK_BOTS_PERMANENTS}}
TK_BOTS_NIVEAU {{TK_BOTS_NIVEAU}}
TK_BOTS_ADAPTATIFS {{TK_BOTS_ADAPTATIFS}}
TK_VOTES {{TK_VOTES}}
TK_VOTES_JOUEURS {{TK_VOTES_JOUEURS}}
TK_VOTES_ANCIENNETE {{TK_VOTES_ANCIENNETE}}
TK_VOTES_MODES {{TK_VOTES_MODES}}
TK_ACCUEIL_INFOS {{TK_ACCUEIL_INFOS}}
TK_ACCUEIL_DUREE {{TK_ACCUEIL_DUREE}}
TK_RAPPEL_MINUTES {{TK_RAPPEL_MINUTES}}
